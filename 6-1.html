<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Flex 布局演示</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing: border-box;
}
body{
    padding:30px;
}
h1{
    text-align:center;
    margin-bottom:40px;
    font-size:36px;
    font-weight:normal;
}
.wrap{
    display:flex;
    gap:32px;
    justify-content:center;
}
/* 外层大盒子，4个完全一样大小 */
.demo-box{
    width:220px;
    height:280px;
    border:1px solid #333;
    display:flex;
    padding:20px;
}
.item{
    background:#cccccc;
    border:1px solid #999;
}

/* 第一个容器：单个方块居中 */
.box1{
    justify-content:center;
    align-items:center;
}
.box1 .item{
    width:50px;
    height:80px;
}

/* 第二个容器：垂直上下两个 */
.box2{
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:16px;
}
.box2 .item{
    width:80px;
    height:50px;
}

/* 第三个容器：田字格 2*2 */
.box3{
    flex-wrap:wrap;
    justify-content:space-around;
    align-content:center;
    gap:16px;
}
.box3 .item{
    width:80px;
    height:80px;
}

/* 第四个容器：上1长条，下并排两个 */
.box4{
    flex-direction:column;
    gap:16px;
}
.box4 .row-top{
    width:100%;
}
.box4 .row-top .item{
    width:100%;
    height:50px;
}
.box4 .row-bottom{
    display:flex;
    gap:16px;
}
.box4 .row-bottom .item{
    flex:1;
    height:80px;
}
</style>
</head>
<body>
<h1>Flex 布局演示</h1>
<div class="wrap">
    <!-- 第1个 -->
    <div class="demo-box box1">
        <div class="item"></div>
    </div>
    <!-- 第2个 -->
    <div class="demo-box box2">
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <!-- 第3个 -->
    <div class="demo-box box3">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <!-- 第4个 -->
    <div class="demo-box box4">
        <div class="row-top">
            <div class="item"></div>
        </div>
        <div class="row-bottom">
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </div>
</div>
</body>
</html>
