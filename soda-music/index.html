<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汽水音乐 · Soda Music</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="flow">

<!-- 背景光晕（颜色跟随当前歌曲变化） -->
<div class="bg-glow"></div>

<!-- ============ 首屏引导 ============ -->
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-mark">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path d="M7 3h10l-1.2 15.2A2.8 2.8 0 0 1 13 21h-2a2.8 2.8 0 0 1-2.8-2.8L7 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M6.6 9h10.8" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </div>
    <h1 class="intro-title">汽水音乐</h1>
    <p class="intro-sub">沉浸式竖滑播放器 · 6 首 · 点击进入开始</p>
    <button class="intro-btn" id="introBtn">进 入</button>
    <div class="intro-foot">@涂玮轩 出品</div>
  </div>
</div>

<!-- ============ 顶部栏 ============ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M7 3h10l-1.2 15.2A2.8 2.8 0 0 1 13 21h-2a2.8 2.8 0 0 1-2.8-2.8L7 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M6.6 9h10.8" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </span>
    <span class="brand-name">汽水音乐</span>
  </div>

  <nav class="nav" id="nav">
    <button class="nav-item active" data-view="flow">推荐</button>
    <button class="nav-item" data-view="picks">精选</button>
    <button class="nav-item" data-view="mine">我的</button>
  </nav>

  <label class="search">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <input id="searchInput" type="text" placeholder="搜索歌曲、歌手或专辑" autocomplete="off">
  </label>

  <button class="avatar" id="avatarBtn" title="涂玮轩">涂</button>
</header>

<!-- ============ 主体：三个视图 ============ -->
<main class="views">

  <!-- 1. 推荐：全屏竖滑 -->
  <section class="view active" id="viewFlow">
    <div class="stage" id="stage"><!-- 由 js/app.js 渲染 --></div>
  </section>

  <!-- 2. 精选：卡片网格 -->
  <section class="view" id="viewPicks">
    <div class="view-inner">
      <div class="view-head">
        <h2>精选歌单</h2>
        <p>编辑挑的今日份汽水 · 点卡片直接播放</p>
      </div>
      <div class="picks-grid" id="picksGrid"></div>
    </div>
  </section>

  <!-- 3. 我的：我喜欢的音乐 -->
  <section class="view" id="viewMine">
    <div class="view-inner">
      <div class="view-head">
        <h2>我喜欢的音乐</h2>
        <p id="mineTip">还没有喜欢的歌，去点个 ♥ 吧</p>
      </div>
      <div class="mine-list" id="mineList"></div>
    </div>
  </section>

</main>

<!-- ============ 右侧操作栏 ============ -->
<aside class="actions">
  <button class="action" id="likeBtn" title="喜欢">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.7C19 15.6 12 20 12 20Z"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>
    <span class="action-count" id="likeCount">12.8万</span>
  </button>

  <button class="action" id="commentBtn" title="评论">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M20 12a8 8 0 1 1-3.2-6.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M4.5 19.5 6 15.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
    </svg>
    <span class="action-count" id="commentCount">3421</span>
  </button>

  <button class="action" id="shareBtn" title="分享">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M14 4h6v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 4 11 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span class="action-count">分享</span>
  </button>

  <button class="action" id="listBtn" title="播放列表">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="18" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M20.6 16V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span class="action-count">列表</span>
  </button>
</aside>

<!-- ============ 底部播放条 ============ -->
<footer class="player">
  <div class="player-left" id="playerLeft" title="回到正在播放">
    <span class="mini-cover" id="miniCover" data-pattern="sun"></span>
    <span class="mini-meta">
      <b id="miniTitle">夏夜晚风</b>
      <small id="miniArtist">涂玮轩</small>
    </span>
  </div>

  <div class="player-center">
    <div class="player-buttons">
      <button class="pbtn small" id="shuffleBtn" title="随机播放">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 7h4l8 10h4M4 17h4l2-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m17.5 4.5 2.5 2.5-2.5 2.5M17.5 14.5l2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="pbtn" id="prevBtn" title="上一首">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 5v14M19 6v12l-9-6 9-6Z" fill="currentColor"/></svg>
      </button>
      <button class="pbtn main" id="playBtn" aria-label="播放">
        <svg class="ico-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13l11-6.5L8 5.5Z" fill="currentColor"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></svg>
      </button>
      <button class="pbtn" id="nextBtn" title="下一首">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 5v14M5 6v12l9-6-9-6Z" fill="currentColor"/></svg>
      </button>
      <button class="pbtn small" id="loopBtn" title="列表循环">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 12a8 8 0 0 1 8-8h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M20 12a8 8 0 0 1-8 8H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="m15 1.8 3 2.2-3 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m9 17.8-3 2.2 3 2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="loop-one">1</span>
      </button>
    </div>

    <div class="progress-row">
      <span class="time" id="curTime">00:00</span>
      <div class="progress" id="progress">
        <div class="progress-in" id="progressIn"></div>
        <div class="progress-dot" id="progressDot"></div>
      </div>
      <span class="time" id="totalTime">01:24</span>
    </div>
  </div>

  <div class="player-right">
    <button class="pbtn small" id="muteBtn" title="静音">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M5 9v6h3l4 3.5v-13L8 9H5Z" fill="currentColor"/>
        <path class="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path class="wave" d="M17.8 6.6a7.5 7.5 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <input type="range" id="volRange" min="0" max="100" value="35" aria-label="音量">
  </div>
</footer>

<!-- ============ 播放列表抽屉 ============ -->
<aside class="drawer" id="drawer">
  <div class="drawer-mask" data-close="drawer"></div>
  <div class="drawer-panel">
    <div class="drawer-head">
      <h2>播放列表</h2>
      <span class="drawer-tip" id="drawerTip">共 6 首 · 合成音源</span>
    </div>
    <div class="drawer-body" id="drawerList"></div>
    <div class="drawer-foot">@涂玮轩 出品 · 网页设计练习作品</div>
  </div>
</aside>

<!-- ============ 评论面板 ============ -->
<aside class="sheet" id="commentSheet">
  <div class="sheet-mask" data-close="comment"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>评论 <span id="sheetCount">0</span></h2>
      <span class="sheet-song" id="sheetSong"></span>
    </div>
    <div class="sheet-body" id="commentList"></div>
    <div class="sheet-foot">
      <input type="text" id="commentInput" placeholder="说点什么…（演示，不会真的发出去）">
      <button class="sheet-send" id="commentSend">发送</button>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>
<div class="nowplay" id="nowplay"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
